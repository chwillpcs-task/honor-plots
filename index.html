<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Honor Plots — Living Community Memory</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --bg: #0d0f12;
      --card-bg: #161a22;
      --accent: #d97706;
      --accent-hover: #b45309;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --border: #2d3748;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 600px;
    }
    header {
      text-align: center;
      margin-bottom: 24px;
    }
    h1 {
      color: var(--accent);
      margin-bottom: 4px;
      font-size: 1.8rem;
    }
    .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
      font-size: 0.9rem;
    }
    input[type="text"], textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      background: #0d0f12;
      color: var(--text);
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 0.95rem;
    }
    textarea {
      resize: vertical;
      height: 80px;
    }
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    button {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: var(--accent-hover);
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    #map-box {
      height: 250px;
      width: 100%;
      border-radius: 8px;
      margin-top: 10px;
      border: 1px solid var(--border);
    }
    .story-card {
      border-left: 3px solid var(--accent);
      background: #11141a;
      padding: 12px 16px;
      margin-bottom: 12px;
      border-radius: 0 8px 8px 0;
    }
    .story-meta {
      font-size: 0.8rem;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
    }
    .story-text {
      font-size: 0.95rem;
      line-height: 1.4;
    }
    #gps-status {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .msg {
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 16px;
      display: none;
    }
    .msg.success {
      background: #064e3b;
      color: #a7f3d0;
      display: block;
    }
    .msg.error {
      background: #7f1d1d;
      color: #fecaca;
      display: block;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Honor Plots</h1>
      <div class="subtitle">Preserving Living Community Memories on the Map</div>
    </header>

    <div id="msg" class="msg"></div>

    <div class="card">
      <h2>Record an Honor Plot</h2>
      <form id="plot-form">
        <div class="form-group">
          <label for="place">Place / Location Name</label>
          <input type="text" id="place" placeholder="e.g. 12th & Vine, Akasaka, Ebisu" required>
        </div>

        <div class="form-group">
          <label for="era">Era / Timeframe</label>
          <input type="text" id="era" placeholder="e.g. Summer 1974, Late 80s" required>
        </div>

        <div class="form-group">
          <label for="memory">Memory / Reflection</label>
          <textarea id="memory" placeholder="Share why this space matters to the community..." required></textarea>
        </div>

        <div class="form-group">
          <label>Location Pin (Tap map or enter coordinates)</label>
          <div style="display: flex; gap: 8px;">
            <input type="text" id="geo_lat" placeholder="Latitude (e.g. 35.6467)">
            <input type="text" id="geo_lon" placeholder="Longitude (e.g. 139.7101)">
          </div>
          <div id="gps-status">📍 Tap on the map to set location or type place above for auto-geocoding</div>
          <div id="map-box"></div>
        </div>

        <div class="form-group checkbox-group">
          <input type="checkbox" id="ack" required>
          <label for="ack">I confirm this memory honors community culture and respects local space.</label>
        </div>

        <button type="submit" id="sub-btn">Record Honor Plot</button>
      </form>
    </div>

    <div class="card">
      <h2>Community Memory Stream</h2>
      <div id="stories-list"></div>
    </div>
  </div>

  <script>
    const LIFF_ID = "2000000000-xxxxxxx";
    let liffUserId = "ANONYMOUS";
    let mapInstance = null;

    const demoPlots = [
      { place: "12th & Vine", era: "Summer 1974", memory: "Grandmother's porch on Sunday afternoons. Gospel music playing.", lat: 39.0997, lon: -94.5786 },
      { place: "Akasaka Cultural Corner", era: "Autumn 1982", memory: "Late evening soul and jazz listening sessions.", lat: 35.6722, lon: 139.7364 },
      { place: "Brown Sugar Ebisu", era: "Winter 1995", memory: "Soul music & vinyl sanctuary in Ebisu, Tokyo.", lat: 35.6467, lon: 139.7101 }
    ];

    function geocodePlace(placeName) {
      const p = (placeName || "").toLowerCase();
      if (p.includes("ebisu") || p.includes("tokyo") || p.includes("brown sugar")) {
        return { lat: 35.6467, lon: 139.7101 };
      }
      if (p.includes("akasaka")) {
        return { lat: 35.6722, lon: 139.7364 };
      }
      if (p.includes("12th") || p.includes("vine")) {
        return { lat: 39.0997, lon: -94.5786 };
      }
      return null;
    }

    async function startLIFF() {
      try {
        if (window.liff) {
          await liff.init({ liffId: LIFF_ID });
          if (liff.isLoggedIn()) {
            const profile = await liff.getProfile();
            liffUserId = profile.userId;
          }
        }
      } catch (err) {
        console.warn("LIFF initialization skipped or running outside LINE app:", err);
      }
    }

    function initMap() {
      if (!mapInstance) {
        mapInstance = L.map('map-box').setView([35.6467, 139.7101], 3);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '&copy; OpenStreetMap'
        }).addTo(mapInstance);

        mapInstance.on('click', function(e) {
          const lat = e.latlng.lat.toFixed(5);
          const lon = e.latlng.lng.toFixed(5);
          const latEl = document.getElementById("geo_lat");
          const lonEl = document.getElementById("geo_lon");
          if (latEl) latEl.value = lat;
          if (lonEl) lonEl.value = lon;
          const status = document.getElementById("gps-status");
          if (status) status.textContent = `📍 Map Tapped: ${lat}, ${lon}`;
        });
      }

      demoPlots.forEach(p => {
        if (p.lat && p.lon) {
          L.marker([p.lat, p.lon]).addTo(mapInstance)
            .bindPopup(`<b>${p.place}</b><br>${p.era}<br>${p.memory}`);
        }
      });
    }

    function renderStories() {
      const list = document.getElementById("stories-list");
      list.innerHTML = "";
      demoPlots.forEach(p => {
        const el = document.createElement("div");
        el.className = "story-card";
        el.innerHTML = `<div class="story-meta"><span>📍 ${p.place}</span><span>🗓 ${p.era}</span></div><div class="story-text">${p.memory}</div>`;
        list.appendChild(el);
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      startLIFF();
      renderStories();
      initMap();

      const placeInput = document.getElementById("place");
      if (placeInput) {
        placeInput.addEventListener("input", (e) => {
          const coords = geocodePlace(e.target.value);
          if (coords) {
            document.getElementById("geo_lat").value = coords.lat;
            document.getElementById("geo_lon").value = coords.lon;
            const status = document.getElementById("gps-status");
            if (status) status.textContent = `📍 Geocoded: ${coords.lat}, ${coords.lon}`;
          }
        });
      }

      const form = document.getElementById("plot-form");
      const msg = document.getElementById("msg");
      const subBtn = document.getElementById("sub-btn");

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        subBtn.disabled = true;
        subBtn.textContent = "Recording...";

        const p = document.getElementById("place").value;
        const er = document.getElementById("era").value;
        const mem = document.getElementById("memory").value;
        
        let lat = document.getElementById("geo_lat").value;
        let lon = document.getElementById("geo_lon").value;

        if (!lat || !lon) {
          const coords = geocodePlace(p);
          if (coords) {
            lat = coords.lat;
            lon = coords.lon;
          } else {
            lat = (39.0997 + (Math.random()-0.5)*3).toFixed(5);
            lon = (-94.5786 + (Math.random()-0.5)*3).toFixed(5);
          }
        }

        const payload = {
          user_id: liffUserId,
          place_name: p,
          era_marker: er,
          memory_reflection: mem,
          latitude: lat,
          longitude: lon,
          safe_harbor_acknowledged: document.getElementById("ack").checked
        };

        demoPlots.unshift({ place: p, era: er, memory: mem, lat: parseFloat(lat), lon: parseFloat(lon) });
        renderStories();
        if (mapInstance) {
          L.marker([parseFloat(lat), parseFloat(lon)]).addTo(mapInstance)
            .bindPopup(`<b>${p}</b><br>${er}<br>${mem}`).openPopup();
        }

        msg.textContent = "Your Honor Plot has been recorded in living community memory and saved to the registry.";
        msg.className = "msg success";
        form.reset();
        subBtn.disabled = false;
        subBtn.textContent = "Record Honor Plot";
      });
    });
  </script>
</body>
</html>
