 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Honor Plots — Our Times</title>
  
  <!-- LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <!-- Leaflet Map CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <style>
    :root {
      --primary: #0072B2;       /* Okabe-Ito Blue */
      --secondary: #009E73;     /* Okabe-Ito Bluish Green */
      --accent: #D55E00;        /* Okabe-Ito Vermilion */
      --bg: #FDFBF7;
      --surface: #FFFFFF;
      --text: #1F2937;
      --muted: #6B7280;
      --border: #E5E7EB;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      min-height: 100vh;
    }

    header.app-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0.65rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .user-info { display: flex; align-items: center; gap: 0.5rem; }
    .user-avatar { width: 32px; height: 32px; border-radius: 50%; background: #E5E7EB; object-fit: cover; }
    .user-name { font-size: 0.85rem; font-weight: 700; color: var(--text); }
    .close-btn { background: none; border: none; font-size: 1.25rem; color: var(--muted); cursor: pointer; }

    /* VISUAL INTRO CARD CAROUSEL */
    #intro-screen {
      max-width: 500px;
      margin: 1rem auto;
      padding: 0 1rem;
    }
    .intro-card {
      display: none;
      background: var(--surface);
      border-radius: 16px;
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      animation: fadeIn 0.25s ease-out;
    }
    .intro-card.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    .card-media {
      width: 100%;
      height: 380px;
      background: #F4EFEA;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .card-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-body {
      padding: 1.25rem;
      text-align: center;
    }
    .card-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 0.35rem;
    }
    .card-caption {
      font-size: 0.95rem;
      color: var(--text);
      font-style: italic;
      margin-bottom: 0.65rem;
    }

    .see-more-btn {
      background: none;
      border: none;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--primary);
      text-decoration: underline;
      cursor: pointer;
      display: inline-block;
      margin-bottom: 1rem;
    }
    .details-drawer {
      display: none;
      background: #FAF8F5;
      border-top: 1px dashed var(--border);
      padding: 0.85rem;
      font-size: 0.82rem;
      color: #374151;
      line-height: 1.45;
      text-align: left;
    }

    .action-btn {
      width: 100%;
      background: var(--primary);
      color: #FFF;
      border: none;
      border-radius: 10px;
      padding: 0.85rem;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      min-height: 48px;
    }

    /* MAIN INTERACTIVE APP */
    #app-screen {
      display: none;
      max-width: 600px;
      margin: 0 auto;
      padding-bottom: 5rem;
    }
    nav.app-tabs {
      display: flex;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .tab-btn {
      flex: 1;
      padding: 0.85rem;
      border: none;
      background: none;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--muted);
      cursor: pointer;
      border-bottom: 3px solid transparent;
      min-height: 48px;
    }
    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
      background: #FAF8F5;
    }

    .app-panel { display: none; padding: 1rem; }
    .app-panel.active { display: block; }

    #map-box { height: 440px; border-radius: 14px; border: 1px solid var(--border); }
    
    .form-card {
      background: var(--surface);
      border-radius: 14px;
      border: 1px solid var(--border);
      padding: 1.25rem;
    }
    .form-group { margin-bottom: 1rem; }
    label { display: block; font-size: 0.82rem; font-weight: 700; margin-bottom: 0.35rem; }
    input[type="text"], textarea {
      width: 100%;
      padding: 0.65rem 0.75rem;
      font-size: 0.95rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #FAFAFA;
      color: var(--text);
    }
    textarea { min-height: 90px; resize: vertical; }
    .helper { font-size: 0.72rem; color: var(--muted); margin-top: 0.25rem; }

    .covenant-box {
      background: #F9FAFB;
      border-left: 3px solid var(--primary);
      padding: 0.75rem;
      font-size: 0.75rem;
      color: var(--muted);
      line-height: 1.4;
      margin-bottom: 1rem;
    }
    .check-row {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      font-size: 0.8rem;
      margin-bottom: 1.25rem;
    }
    .check-row input { margin-top: 0.15rem; min-width: 18px; min-height: 18px; }

    .story-card {
      background: var(--surface);
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 1rem;
      margin-bottom: 0.75rem;
    }
    .story-place { font-size: 1rem; font-weight: 800; color: var(--primary); }
    .story-era {
      display: inline-block;
      background: #EBF8FF;
      color: var(--primary);
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 700;
      margin: 0.25rem 0 0.4rem;
    }
    .story-text { font-size: 0.88rem; color: #374151; font-style: italic; }
  </style>
</head>

  <div class="user-info">

    <span class="user-name" id="user-name">Welcome</span>
  </div>
  <button type="button" class="close-btn" onclick="closeApp()">✕</button>
</header>
